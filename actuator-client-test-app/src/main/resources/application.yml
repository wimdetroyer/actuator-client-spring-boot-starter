spring:
  application:
    name: actuator-test-app
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  quartz:
    job-store-type: memory
    properties:
      org.quartz.threadPool.threadCount: 3
  h2:
    console:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      enabled: true
    sbom:
      enabled: true
    health:
      show-details: always
      show-components: always
    env:
      show-values: always
    configprops:
      show-values: always
  info:
    env:
      enabled: true
    build:
      enabled: true
    git:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

logging:
  level:
    com.wimdetroyer: DEBUG
  file:
    name: logs/app.log

info:
  app:
    name: Actuator Test Application
    description: Test application for actuator-client-spring-boot-starter
    version: 1.0.0

server:
  port: 8081
